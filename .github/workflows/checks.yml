name: Book checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Structure, evidence, learning maps and chart parity
        run: python3 tools/check_learning.py
      - name: JavaScript syntax
        run: |
          node --check js/data.js
          node --check js/app.js
      - name: Install browser test tools outside the repository
        run: |
          npm install --prefix "$RUNNER_TEMP/book-browser" --no-save playwright@1.62.1
          "$RUNNER_TEMP/book-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser regression checks
        run: NODE_PATH="$RUNNER_TEMP/book-browser/node_modules" node tools/check_browser.cjs
